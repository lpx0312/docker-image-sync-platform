version: '3.8'

services:
  app-all:
    build:
      context: .
      dockerfile: Dockerfile-all
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: docker-image-sync-platform:all
    container_name: docker-sync-all
    ports:
      - "80:80"      # Nginx 前端服务
      - "8080:8080"  # 后端 API 服务 (可选，用于直接访问)
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
    volumes:
      # 持久化日志
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # MySQL 数据库 (如果需要)
  mysql:
    image: mysql:8.0
    container_name: docker-sync-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: docker_sync
      MYSQL_USER: docker_sync
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: