# ============================================================================
# Docker镜像同步平台配置文件
# ============================================================================
# 
# 本配置文件包含了系统运行所需的所有配置项，请根据您的实际环境进行调整
# 
# 注意事项：
# 1. 请勿将包含敏感信息的配置文件提交到版本控制系统
# 2. 生产环境建议使用环境变量或密钥管理系统
# 3. 修改配置后需要重启服务才能生效
# 
# ============================================================================

# ----------------------------------------------------------------------------
# 服务器配置
# ----------------------------------------------------------------------------
server:
  # 服务监听端口
  # 默认: 8080, 开发环境可使用: 8081, 生产环境建议使用: 8080
  port: 8080
  
  # 运行模式
  # debug: 开发模式，输出详细日志，启用调试功能
  # release: 生产模式，优化性能，减少日志输出
  # test: 测试模式，用于单元测试和集成测试
  mode: debug
  
  # 服务监听地址
  # 0.0.0.0: 监听所有网络接口（推荐）
  # 127.0.0.1: 仅监听本地回环接口
  host: "0.0.0.0"

# ----------------------------------------------------------------------------
# 数据库配置
# ----------------------------------------------------------------------------
database:
  # 数据库服务器地址
  # 本地开发: localhost 或 127.0.0.1
  # Docker环境: mysql（服务名）
  # 远程服务器: 具体IP地址或域名
  host: "guac.sktill.top"
  
  # 数据库端口
  # MySQL默认端口: 3306
  port: 33306
  
  # 数据库用户名
  # 建议为应用创建专用数据库用户，避免使用root
  username: "root"
  
  # 数据库密码
  # 生产环境请使用强密码，建议通过环境变量设置
  password: "Lipanxiang@1102"
  
  # 数据库名称
  # 应用专用数据库，会自动创建表结构
  database: "docker_sync"
  
  # 字符集设置
  # utf8mb4: 支持完整的UTF-8字符集，包括emoji
  charset: "utf8mb4"
  
  # 时间解析设置
  # true: 自动解析时间字段为Go的time.Time类型
  parse_time: true
  
  # 时区设置
  # Local: 使用系统本地时区
  # UTC: 使用UTC时区
  loc: "Local"
  
  # 连接池配置
  max_idle_conns: 10    # 最大空闲连接数
  max_open_conns: 100   # 最大打开连接数
  conn_max_lifetime: 3600  # 连接最大生存时间（秒）

# ----------------------------------------------------------------------------
# Git仓库配置
# ----------------------------------------------------------------------------
git:
  # Gitee仓库配置（国内代码托管平台）
  gitee:
    # 仓库URL地址
    # 格式: https://gitee.com/用户名/仓库名.git
    repo_url: "https://gitee.com/lpx03/docker_image_pusher.git"
    
    # Gitee用户名
    # 您的Gitee账号用户名
    username: "13297049661"
    
    # Gitee密码或访问令牌
    # 建议使用访问令牌而非密码，安全性更高
    # 获取方式: Gitee -> 设置 -> 私人令牌
    password: "Abc2020##"
    
    # 提交邮箱
    # Git提交时使用的邮箱地址，建议与Gitee账号邮箱一致
    email: "lpx_0312@163.com"
    
  # GitHub仓库配置（国际代码托管平台）
  github:
    # 仓库URL地址
    # 格式: https://github.com/用户名/仓库名
    repo_url: "https://github.com/lpx0312/docker_image_pusher.git"
    
    # GitHub用户名
    # 您的GitHub账号用户名
    username: "lpx_0312@163.com"
    
    # GitHub Personal Access Token
    # 必须使用Personal Access Token，不支持密码认证
    # 获取方式: GitHub -> Settings -> Developer settings -> Personal access tokens
    # 所需权限: repo, workflow
    token: "REDACTED_GITHUB_TOKEN"

# ----------------------------------------------------------------------------
# 阿里云容器镜像服务(ACR)配置
# ----------------------------------------------------------------------------
aliyun:
  # 镜像仓库地址
  # 不同地域的仓库地址不同:
  # 华东1(杭州): registry.cn-hangzhou.aliyuncs.com
  # 华北2(北京): registry.cn-beijing.aliyuncs.com
  # 华南1(深圳): registry.cn-shenzhen.aliyuncs.com
  registry: "registry.cn-hangzhou.aliyuncs.com"
  
  # 命名空间
  # 阿里云ACR中的命名空间，用于组织镜像
  # 需要在阿里云控制台预先创建
  namespace: "lpx03"
  
  # 阿里云账号用户名
  # 用于登录阿里云容器镜像服务的用户名
  username: "lipanx"
  
  # 阿里云账号密码
  # 用于登录阿里云容器镜像服务的密码
  # 建议使用RAM用户而非主账号
  password: "Lipanxiang1102"

# ----------------------------------------------------------------------------
# 日志配置
# ----------------------------------------------------------------------------
log:
  # 日志级别
  # debug: 调试信息，最详细的日志输出
  # info: 一般信息，记录重要的业务操作
  # warn: 警告信息，记录可能的问题
  # error: 错误信息，记录系统错误
  level: "info"
  
  # 日志文件路径
  # 日志文件的存储路径，支持相对路径和绝对路径
  file_path: "./logs/app.log"
  
  # 单个日志文件最大大小（MB）
  # 超过此大小会自动轮转到新文件
  max_size: 100
  
  # 保留的日志文件数量
  # 超过此数量的旧日志文件会被自动删除
  max_backups: 3
  
  # 日志文件保留天数
  # 超过此天数的日志文件会被自动删除
  max_age: 28
  
  # 是否压缩轮转的日志文件
  # true: 压缩旧日志文件以节省空间
  compress: true

# ----------------------------------------------------------------------------
# 同步任务配置
# ----------------------------------------------------------------------------
sync:
  # 同步任务超时时间（分钟）
  # 单个镜像同步任务的最大执行时间
  # 超过此时间的任务会被标记为超时失败
  timeout_minutes: 30
  
  # 最大并发同步任务数
  # 同时执行的镜像同步任务数量限制
  max_concurrent_jobs: 3
  
  # 失败重试次数
  # 同步失败时的自动重试次数
  max_retry_count: 3
  
  # 重试间隔时间（分钟）
  # 重试之间的等待时间
  retry_interval_minutes: 5

# ----------------------------------------------------------------------------
# GitHub Actions配置
# ----------------------------------------------------------------------------
github_actions:
  # 工作流文件名
  # GitHub Actions工作流配置文件名
  workflow_file: "docker.yaml"
  
  # API请求超时时间（秒）
  # GitHub API请求的超时时间
  api_timeout_seconds: 30
  
  # 状态检查间隔（秒）
  # 检查GitHub Actions执行状态的间隔时间
  status_check_interval_seconds: 60

# ----------------------------------------------------------------------------
# 安全配置
# ----------------------------------------------------------------------------
security:
  # API限流配置
  rate_limit:
    # 每分钟最大请求数
    requests_per_minute: 100
    
    # 突发请求数
    burst: 10
  
  # CORS跨域配置
  cors:
    # 允许的源域名
    allowed_origins: ["*"]
    
    # 允许的HTTP方法
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    
    # 允许的请求头
    allowed_headers: ["*"]