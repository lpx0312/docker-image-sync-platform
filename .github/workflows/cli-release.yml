# ============================================================================
# Docker镜像同步平台 - dsync CLI 构建发布流水线
# ============================================================================
#
# 交叉编译 dsync 命令行客户端（cmd/dsync，纯 Go 无 CGO），产出：
#   - dsync-linux-amd64.tar.gz
#   - dsync-linux-arm64.tar.gz
#   - dsync-darwin-amd64.tar.gz   (macOS Intel)
#   - dsync-darwin-arm64.tar.gz   (macOS Apple Silicon)
# 以及每个文件的 sha256 校验值。
#
# 触发方式：
#   - 手动触发（workflow_dispatch）或推送 cli-v* 标签：构建后覆盖发布到
#     固定 Release「cli-latest」（附件 clobber 覆盖），并标为 GitHub latest，
#     这样 skill 的 /releases/latest/download/ 地址始终拿到当前构建。
#   - TODO(稳定后恢复)：仅 cli-v* 标签创建版本 Release；手动触发只留 artifact。
#
# 本地等价命令：
#   CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
#     go build -trimpath -o dsync-linux-arm64 ./cmd/dsync
# ============================================================================

name: cli-release

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

# 同一标签重复推送时取消旧构建
concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: true

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: 构建 dsync (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 计算版本号
        id: version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo dev)
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: 交叉编译
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }} -X main.buildTime=${{ steps.version.outputs.build_time }}" \
            -trimpath \
            -o "dist/dsync-${GOOS}-${GOARCH}" \
            ./cmd/dsync

      - name: 打包并生成校验和
        run: |
          cd dist
          tar -czf "dsync-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "dsync-${{ matrix.goos }}-${{ matrix.goarch }}"
          sha256sum "dsync-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" > "dsync-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256"
          ls -lh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dsync-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz*
          retention-days: 14
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    # 现阶段每次构建都覆盖 cli-latest。稳定后改回：
    #   if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成汇总校验和
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          ls -lh

      - name: 覆盖发布到 cli-latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: cli-latest
        run: |
          NOTES="dsync CLI 多平台构建产物（滚动覆盖发布）。

          来源：${GITHUB_SHA:0:7} / ${GITHUB_REF_NAME}

          ## 安装

          \`\`\`bash
          curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dsync-linux-amd64.tar.gz
          tar -xzf dsync-linux-amd64.tar.gz
          sudo install -m 0755 dsync-linux-amd64 /usr/local/bin/dsync
          dsync --help
          \`\`\`

          完整使用说明见仓库 \`docs/dsync-cli.md\`。"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --latest --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              --title "dsync $TAG" \
              --notes "$NOTES" \
              --latest \
              dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY"
          fi
