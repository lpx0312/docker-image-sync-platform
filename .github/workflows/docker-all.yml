# ============================================================================
# Docker镜像同步平台 - All-in-One 镜像流水线 (前后端合一)
# ============================================================================
#
# 构建 deploy/docker-all/Dockerfile-all（前端 + 后端 + Nginx 单镜像），
# 产出多架构 OCI 镜像（linux/amd64 + linux/arm64 manifest list），
# 并推送至阿里云 ACR，tag 规则与 deploy/docker-all/Makefile 保持一致：
#   - all-latest
#   - all-<git describe --tags --always>   (如 all-V2.0.0 / all-<sha>)
#
# 所需 GitHub Secrets（Settings → Secrets and actions → Actions）：
#   - ALIYUN_USERNAME  阿里云镜像仓库用户名
#   - ALIYUN_PASSWORD  阿里云镜像仓库密码
# ============================================================================

name: docker-all

on:
  push:
    # Gitee 主分支为 master，GitHub 主分支为 main
    branches: [master, main]
    tags: ['v*', 'V*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.cursor/**'
      - '.claude/**'
  workflow_dispatch:

# 同一分支/标签的新推送取消旧构建，节省 runner 时间
concurrency:
  group: docker-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 deploy/docker-all/Makefile 保持一致（非敏感信息）
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ALIYUN_NAMESPACE: lpx03
  IMAGE_NAME: docker-image-sync-platform

jobs:
  diagnose-npm:
    name: 诊断容器内 npm 网络
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 容器内跑 npm ci 观察 HTTP 请求
        run: |
          docker run --rm -v "$PWD/web:/src" -w /src \
            registry.cn-hangzhou.aliyuncs.com/lpx03/node:18-alpine \
            sh -c 'node --version; npm --version; npm config set registry https://registry.npmjs.org; npm ci --no-audit --no-fund --loglevel http 2>&1 | tail -100; echo "exit=$?"; ls node_modules/.bin 2>/dev/null | head -5'

  build-and-push:
    name: 构建并推送 All-in-One 镜像
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # git describe 需要完整历史与 tag
          fetch-depth: 0

      - name: 计算镜像版本号
        id: version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "镜像版本: ${VERSION}"

      - name: 设置 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker-all/Dockerfile-all
          platforms: linux/amd64,linux/arm64
          push: true
          # 海外 runner 使用官方源，避免访问国内镜像站不稳定导致构建失败
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
            APK_MIRROR=dl-cdn.alpinelinux.org
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.IMAGE_NAME }}:all-latest
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.IMAGE_NAME }}:all-${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像信息
        run: |
          echo "✅ 多架构镜像推送完成 (linux/amd64, linux/arm64)"
          echo "  ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.IMAGE_NAME }}:all-latest"
          echo "  ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.IMAGE_NAME }}:all-${{ steps.version.outputs.version }}"
