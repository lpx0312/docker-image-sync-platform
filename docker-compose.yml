version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: docker-sync-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docker_sync}
      MYSQL_USER: ${MYSQL_USER:-docker_sync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sync123456}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - docker-sync-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-sync-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - git_repo:/app/git_repo
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - docker-sync-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务（可选，如果需要单独部署前端）
  frontend:
    image: nginx:alpine
    container_name: docker-sync-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - docker-sync-network

volumes:
  mysql_data:
    driver: local
  git_repo:
    driver: local

networks:
  docker-sync-network:
    driver: bridge