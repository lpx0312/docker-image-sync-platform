# ============================================================================
# Docker镜像同步平台 - Docker Compose配置文件
# ============================================================================
# 
# 本文件定义了完整的应用程序栈，包括：
# - MySQL数据库服务
# - Go后端应用服务  
# - Nginx前端服务
# 
# 使用方法：
# 1. 开发环境：docker-compose up -d
# 2. 生产环境：docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 3. 停止服务：docker-compose down
# 4. 查看日志：docker-compose logs -f [service_name]
# 
# 环境变量：
# 请在 .env 文件中设置相关环境变量，或通过系统环境变量传递
# 
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # MySQL数据库服务
  # ============================================================================
  mysql:
    # 使用官方MySQL 8.0镜像，稳定且功能完整
    image: mysql:8.0
    
    # 容器名称，便于管理和日志查看
    container_name: docker-sync-mysql
    
    # 重启策略：除非手动停止，否则总是重启
    restart: unless-stopped
    
    # 环境变量配置
    environment:
      # MySQL root用户密码
      # 生产环境请使用强密码，建议通过.env文件设置
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      
      # 应用数据库名称
      # 启动时自动创建此数据库
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docker_sync}
      
      # 应用专用数据库用户
      # 建议使用专用用户而非root用户
      MYSQL_USER: ${MYSQL_USER:-docker_sync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sync123456}
      
      # 字符集和排序规则设置
      # 确保支持完整的UTF-8字符集
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    
    # 端口映射
    # 格式：宿主机端口:容器端口
    # 生产环境建议不暴露数据库端口到外网
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    
    # 数据卷挂载
    volumes:
      # 数据持久化：将MySQL数据目录挂载到命名卷
      - mysql_data:/var/lib/mysql
      
      # 初始化脚本：容器启动时自动执行SQL脚本
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      
      # 数据库迁移脚本：按文件名顺序执行
      - ./sql/migrate_add_architecture_default.sql:/docker-entrypoint-initdb.d/02-migrate-architecture.sql
      - ./sql/migrate_add_batch_sync_support.sql:/docker-entrypoint-initdb.d/03-migrate-batch-sync.sql
      - ./sql/migrate_add_deleted_at.sql:/docker-entrypoint-initdb.d/04-migrate-deleted-at.sql
      
      # MySQL配置文件（可选）
      # - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    
    # 网络配置
    networks:
      - docker-sync-network
    
    # 健康检查配置
    # 确保数据库完全启动后再启动依赖服务
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s      # 检查间隔
      timeout: 5s        # 超时时间
      retries: 5         # 重试次数
      start_period: 30s  # 启动等待时间
    
    # 资源限制（可选，生产环境推荐）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    #       cpus: '0.5'
    #     reservations:
    #       memory: 512M

  # ============================================================================
  # Go后端应用服务
  # ============================================================================
  app:
    # 构建配置
    build:
      # 构建上下文：当前目录
      context: .
      
      # Dockerfile路径
      dockerfile: Dockerfile
      
      # 构建参数（可选）
      # args:
      #   GO_VERSION: 1.21
      #   BUILD_ENV: production
    
    # 容器名称
    container_name: docker-sync-app
    
    # 重启策略
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "${APP_PORT:-8080}:8080"
    
    # 环境变量
    environment:
      # Gin框架运行模式
      # debug: 开发模式，详细日志
      # release: 生产模式，优化性能
      - GIN_MODE=${GIN_MODE:-release}
      
      # 数据库连接配置
      # 使用服务名作为主机名（Docker内部网络）
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-docker_sync}
      - DB_PASSWORD=${MYSQL_PASSWORD:-sync123456}
      - DB_NAME=${MYSQL_DATABASE:-docker_sync}
      
      # 应用配置
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    
    # 数据卷挂载
    volumes:
      # 配置文件挂载
      # 允许在不重建镜像的情况下修改配置
      - ./config.yaml:/app/config.yaml:ro
      
      # 日志目录挂载
      # 便于查看和收集应用日志
      - ./logs:/app/logs
      
      # Git仓库临时目录
      # 用于存储克隆的Git仓库
      - git_repo:/app/temp
      
      # 时区设置（可选）
      # - /etc/localtime:/etc/localtime:ro
    
    # 服务依赖
    # 确保MySQL服务健康后再启动应用
    depends_on:
      mysql:
        condition: service_healthy
    
    # 网络配置
    networks:
      - docker-sync-network
    
    # 健康检查
    # 监控应用服务状态
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s      # 检查间隔
      timeout: 10s       # 超时时间
      retries: 3         # 重试次数
      start_period: 40s  # 启动等待时间
    
    # 资源限制（生产环境推荐）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: '0.5'

  # ============================================================================
  # Nginx前端服务
  # ============================================================================
  frontend:
    # 使用轻量级的Alpine Linux版本
    image: nginx:alpine
    
    # 容器名称
    container_name: docker-sync-frontend
    
    # 重启策略
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"  # HTTPS端口（如需要）
    
    # 数据卷挂载
    volumes:
      # 前端静态文件
      # 需要先构建前端项目：cd web && npm run build
      - ./web/dist:/usr/share/nginx/html:ro
      
      # Nginx配置文件
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      
      # SSL证书（如需要HTTPS）
      # - ./ssl:/etc/nginx/ssl:ro
      
      # Nginx日志
      - ./logs/nginx:/var/log/nginx
    
    # 服务依赖
    # 确保后端服务启动后再启动前端
    depends_on:
      - app
    
    # 网络配置
    networks:
      - docker-sync-network
    
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================================
# 数据卷定义
# ============================================================================
volumes:
  # MySQL数据持久化卷
  # 确保数据库数据在容器重启后不丢失
  mysql_data:
    driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/mysql  # 自定义数据存储路径
  
  # Git仓库临时存储卷
  # 用于存储克隆的Git仓库文件
  git_repo:
    driver: local

# ============================================================================
# 网络定义
# ============================================================================
networks:
  # 应用内部网络
  # 所有服务通过此网络通信
  docker-sync-network:
    driver: bridge
    # 自定义网络配置（可选）
    # ipam:
    #   config:
    #     - subnet: 172.20.0.0/16